{% extends "base.html" %}
{% block title %}Sign in — Metrology Compliance Scanner{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="panel login-card">
    <div style="margin-bottom:18px;">
      <span class="mark" style="display:inline-flex;width:26px;height:26px;border:1.5px solid var(--ink);align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;border-radius:2px;">LM</span>
    </div>
    <h1 style="font-size:20px;">Enforcement sign-in</h1>
    <p class="field-hint" style="color:var(--ink-soft);font-size:13px;margin-top:0;">Legal Metrology (Packaged Commodities) Rules, 2011 — compliance scanner</p>

    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button class="btn" type="submit" style="width:100%;justify-content:center;">Sign in</button>
    </form>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:16px;">
      Prototype credentials — admin / admin123 &nbsp;·&nbsp; officer / officer123
    </p>
  </div>
</div>
{% endblock %}
